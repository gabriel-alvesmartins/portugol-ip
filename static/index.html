<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão - Saúde</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar or Header -->
        <header class="glass-header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                </svg>
                <span>MediCare System</span>
            </div>
            <button class="btn-primary" onclick="openModal()">+ Novo Paciente</button>
        </header>

        <!-- Main Content -->
        <main class="content">
            <div class="table-container glass-panel">
                <div class="table-header">
                    <h2>Pacientes Cadastrados</h2>
                    <input type="text" id="searchInput" placeholder="Buscar paciente..." class="search-input">
                </div>
                <table id="pacientesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Idade</th>
                            <th>Telefone</th>
                            <th>Diagnóstico</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="pacientesTbody">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div id="pacienteModal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 id="modalTitle">Cadastrar Paciente</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <form id="pacienteForm">
                <input type="hidden" id="pacienteId">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Ex: João da Silva">
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="joao@email.com">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" required placeholder="000.000.000-00">
                    </div>
                    <div class="form-group">
                        <label for="idade">Idade</label>
                        <input type="number" id="idade" required min="0" max="150" placeholder="Ex: 35">
                    </div>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" required placeholder="(11) 99999-9999">
                </div>
                <div class="form-group">
                    <label for="diagnostico">Diagnóstico Inicial</label>
                    <textarea id="diagnostico" rows="3" placeholder="Descreva brevemente..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar Paciente</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
